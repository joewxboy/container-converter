version: '2.4'

services:
  web:
    image: nginx:alpine
    ports:
      - '80:80'
    environment:
      - NGINX_HOST=example.com
    restart: always

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: app
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - '3306:3306'

volumes:
  mysql-data:
