services:
  web:
    image: nginx:alpine
    ports:
      - '8080:80/tcp'
      - '8443:443/tcp'
    environment:
      NGINX_HOST: localhost
      NGINX_PORT: 80

  api:
    image: node:18-alpine
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
    command: ['node', 'server.js']

  cache:
    image: redis:7-alpine
    ports:
      - '6379:6379'
